pluginManagement {
    def flutterSdkPath = System.getenv("FLUTTER_ROOT") ?: {
        def properties = new Properties()
        def localProps = file("local.properties")
        if (localProps.exists()) {
            localProps.withInputStream { properties.load(it) }
        }
        return properties.getProperty("flutter.sdk")
    }()
    assert flutterSdkPath != null, "Flutter SDK not found"
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
    }
    plugins {
        id "dev.flutter.flutter-plugin-loader" version "1.0.0"
        id "com.android.application" version "8.9.1" apply false
        id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    }
}
include ":app"
